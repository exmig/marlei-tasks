# ---------------------------------------------------------------------------
# nginx als Reverse Proxy vor MARLEI Tasks
#
# Warum ueberhaupt nginx, wo doch nichts Grosses ausgeliefert wird?
# Nicht wegen der Last -- hier gibt es keine Gigabyte wie in MARLEI Boot.
# Sondern weil der Port, unter dem dieses Werkzeug erreichbar ist, dann
# eine Sache der Maschine ist und nicht der Anwendung: uvicorn hoert auf
# 127.0.0.1 und wird von aussen gar nicht erst angesprochen.
#
# ES GIBT HIER KEIN default_server, UND DAS IST DER GANZE PUNKT.
# Auf einer Maschine, auf der schon MARLEI Boot laeuft, traegt DESSEN
# vhost das "default_server" auf Port 80. Ein zweites auf demselben Port
# laesst nginx nicht mehr starten -- und dann steht nicht dieses Werkzeug
# still, sondern der Bootserver. Deshalb: eigener Port, kein
# default_server, und install.sh prueft vorher nach, ob der Port frei ist.
#
# Platzhalter: @@PORT@@
# ---------------------------------------------------------------------------

server {
    listen @@PORT@@;
    listen [::]:@@PORT@@;
    server_name _;

    # Hier wird nichts hochgeladen -- ein Formular mit einem langen Text
    # ist das Groesste, was hereinkommt. Die Vorgabe von 1 MB ist
    # grosszuegig; sie steht trotzdem da, weil eine Grenze, die man nicht
    # gesetzt hat, auch keine ist.
    client_max_body_size 1m;

    access_log /var/log/nginx/marlei-tasks-access.log;
    error_log  /var/log/nginx/marlei-tasks-error.log;

    # --- Stylesheet, Logo, Favicon -----------------------------------------
    # Sie liegen als Kopie unter /opt/marlei-tasks/static und tragen in der
    # Adresse eine Version (?v=...). nginx liefert sie aus, ohne die
    # Anwendung zu wecken.
    location /static/ {
        alias /opt/marlei-tasks/static/;
        expires 1h;
    }

    # --- Alles andere: die Anwendung ---------------------------------------
    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
